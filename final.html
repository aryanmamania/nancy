<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Forever | Nancy</title>

  <!-- Same fonts as all other pages -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <style>

    /* =================================================
       FINAL PAGE
       ================================================= */

    body {
      min-height: 100vh;

      margin: 0;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255,255,255,.95),
          transparent 28%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(126,164,187,.18),
          transparent 32%
        ),

        linear-gradient(
          135deg,
          #f5f9fc 0%,
          #e4eff5 50%,
          #eef5f8 100%
        );

      color: #20394d;

      font-family:
        "Poppins",
        sans-serif;

      overflow-x: hidden;
    }


    /* =================================================
       FINAL PAGE CONTENT
       ================================================= */

    .final-page {

      min-height:
        calc(100vh - 100px);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        80px
        25px
        70px;

      position:
        relative;
    }


    /* Decorative glow */

    .final-page::before {

      content:
        "";

      position:
        absolute;

      width:
        420px;

      height:
        420px;

      border-radius:
        50%;

      background:
        radial-gradient(
          circle,
          rgba(104,148,174,.18),
          transparent 70%
        );

      filter:
        blur(5px);

      z-index:
        0;

      pointer-events:
        none;
    }


    /* =================================================
       SMALL HEADING
       ================================================= */

    .final-page .script-text {

      position:
        relative;

      z-index:
        2;

      margin:
        0 0 12px;

      font-family:
        "Dancing Script",
        cursive;

      font-size:
        clamp(
          28px,
          5vw,
          44px
        );

      color:
        #557c96;
    }


    /* =================================================
       MAIN HEADING
       ================================================= */

    .final-page h1 {

      position:
        relative;

      z-index:
        2;

      max-width:
        900px;

      margin:
        0;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(
          48px,
          8vw,
          88px
        );

      line-height:
        1;

      font-weight:
        500;

      color:
        #20394d;

      letter-spacing:
        -1px;
    }


    /* =================================================
       DESCRIPTION
       ================================================= */

    .final-page > p:not(.script-text) {

      position:
        relative;

      z-index:
        2;

      max-width:
        620px;

      margin:
        28px
        0
        35px;

      color:
        #557083;

      font-family:
        "Poppins",
        sans-serif;

      font-size:
        15px;

      line-height:
        1.9;
    }


    /* =================================================
       REPLAY BUTTON
       ================================================= */

    .final-page .btn {

      position:
        relative;

      z-index:
        2;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-width:
        170px;

      padding:
        14px
        26px;

      border-radius:
        40px;

      text-decoration:
        none;

      font-family:
        "Poppins",
        sans-serif;

      font-size:
        13px;

      font-weight:
        600;

      letter-spacing:
        .2px;

      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          #20394d,
          #416b89
        );

      border:
        1px solid
        rgba(255,255,255,.35);

      box-shadow:
        0 15px 30px
        rgba(32,57,77,.20);

      transition:
        all
        .35s
        ease;
    }


    .final-page .btn:hover {

      transform:
        translateY(-5px);

      background:
        linear-gradient(
          135deg,
          #315a78,
          #527f9d
        );

      box-shadow:
        0 20px 40px
        rgba(32,57,77,.28);
    }


    /* =================================================
       LITTLE DECORATIONS
       ================================================= */

    .final-page::after {

      content:
        "✦   ♡   ✦";

      position:
        absolute;

      bottom:
        45px;

      left:
        50%;

      transform:
        translateX(-50%);

      color:
        rgba(75,116,139,.35);

      font-size:
        22px;

      letter-spacing:
        12px;

      z-index:
        1;
    }


    /* =================================================
       BOTTOM NAVIGATION
       ================================================= */

    .bottom-navigation {

      position:
        relative;

      z-index:
        50;

      width:
        100%;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      flex-wrap:
        wrap;

      gap:
        10px;

      padding:
        18px
        20px
        30px;

      background:
        linear-gradient(
          180deg,
          rgba(245,249,252,.80),
          rgba(221,233,243,.97)
        );

      border-top:
        1px solid
        rgba(255,255,255,.85);

      box-shadow:
        0 -12px 35px
        rgba(38,67,88,.08);

      backdrop-filter:
        blur(14px);
    }


    .bottom-navigation a {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        10px 18px;

      border-radius:
        30px;

      text-decoration:
        none;

      color:
        #35566e;

      background:
        rgba(255,255,255,.78);

      border:
        1px solid
        rgba(57,91,116,.13);

      font-family:
        "Poppins",
        sans-serif;

      font-size:
        13px;

      font-weight:
        500;

      box-shadow:
        0 6px 18px
        rgba(38,67,88,.07);

      transition:
        all
        .3s
        ease;
    }


    .bottom-navigation a:hover {

      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          #315a78,
          #4e7c9b
        );

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 22px
        rgba(38,67,88,.20);
    }


    /* Final page active */

    .bottom-navigation a.active {

      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          #20394d,
          #416b89
        );

      box-shadow:
        0 9px 22px
        rgba(23,43,61,.22);
    }


    /* =================================================
       MOBILE
       ================================================= */

    @media (max-width: 700px) {

      .final-page {

        min-height:
          calc(100vh - 80px);

        padding:
          70px
          20px
          60px;
      }


      .final-page h1 {

        font-size:
          clamp(
            45px,
            13vw,
            68px
          );
      }


      .final-page > p:not(.script-text) {

        font-size:
          14px;

        max-width:
          500px;

        line-height:
          1.8;
      }


      .bottom-navigation {

        gap:
          7px;

        padding:
          15px
          10px
          25px;
      }


      .bottom-navigation a {

        font-size:
          11px;

        padding:
          9px
          12px;
      }
    }


    @media (max-width: 420px) {

      .final-page {

        padding:
          60px
          15px
          55px;
      }


      .final-page .script-text {

        font-size:
          27px;
      }


      .final-page h1 {

        font-size:
          46px;

        line-height:
          1.02;
      }


      .final-page > p:not(.script-text) {

        font-size:
          13px;
      }


      .final-page .btn {

        padding:
          12px
          22px;

        min-width:
          155px;
      }


      .bottom-navigation {

        gap:
          5px;
      }


      .bottom-navigation a {

        padding:
          8px
          9px;

        font-size:
          9px;
      }
    }

  </style>
</head>


<body>

  <!-- Background -->

  <div class="cursor-glow"></div>


  <!-- =================================================
       FINAL CONTENT
       ================================================= -->

  <main class="final-page reveal">

    <p class="script-text">
      forever chapter
    </p>


    <h1>
      You’ll always be my favorite chapter.
    </h1>


    <p>
      Even when this little website ends,
      the love inside it keeps glowing.
    </p>


    <a
      class="btn primary"
      href="index.html"
    >
      Replay Story
    </a>

  </main>


  <!-- =================================================
       BOTTOM NAVIGATION
       ================================================= -->

  <nav class="bottom-navigation">

    <a href="index.html">
      Home
    </a>

    <a href="memories.html">
      Memories
    </a>

    <a href="reasons.html">
      Reasons
    </a>

    <a href="letter.html">
      Letter
    </a>

    <a href="cake.html">
      Cake
    </a>

    <a
      href="final.html"
      class="active"
    >
      Final
    </a>

  </nav>


  <script src="script.js"></script>

</body>

</html>
